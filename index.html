<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Shift: junior security team</title>
<meta name="description" content="Interactive cybersecurity training for teens: passwords, phishing, least privilege and ethical hacking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#F2F3FB; --surface:#FFFFFF; --surface2:#E6E8F6; --text:#161A3A; --muted:#4F5586; --line:#C9CEEA;
  --accent:#FFB547; --accent-ink:#2A1B00; --accent-text:#8A4F00;
  --safe:#0B7A55; --safe-bg:#DDF5EC; --danger:#BE2237; --danger-bg:#FBE3E6; --info:#0B64A0; --info-bg:#DDEEFA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12152B; --surface:#1B2040; --surface2:#262C57; --text:#ECEBFA; --muted:#A5AAD3; --line:#363E70;
    --accent:#FFB547; --accent-ink:#2A1B00; --accent-text:#FFC36B;
    --safe:#5BE3B0; --safe-bg:#12392F; --danger:#FF7081; --danger-bg:#41202C; --info:#78CBFF; --info-bg:#16344D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12152B; --surface:#1B2040; --surface2:#262C57; --text:#ECEBFA; --muted:#A5AAD3; --line:#363E70;
  --accent:#FFB547; --accent-ink:#2A1B00; --accent-text:#FFC36B;
  --safe:#5BE3B0; --safe-bg:#12392F; --danger:#FF7081; --danger-bg:#41202C; --info:#78CBFF; --info-bg:#16344D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.55}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;line-height:1.12;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5.5vw,3.3rem);font-weight:800}
h2{font-size:clamp(1.3rem,3vw,1.7rem);font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0 0 1em;max-width:68ch}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.15rem;background:none;border:0;padding:4px 0;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 28%,transparent)}
.rank{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.92rem}
.rank b{font-weight:700}
.xpbar{width:110px;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.xpbar span{display:block;height:100%;background:var(--accent);transition:width .5s}
.tbtn{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.88rem}
main{padding:28px 0 60px}

/* buttons & forms */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:4px 0;color:var(--accent-text);font-weight:600;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
input[type=text]{width:100%;font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.15rem;padding:13px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--text)}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--accent)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.notice{background:var(--info-bg);color:var(--text);border-left:5px solid var(--info);border-radius:8px;padding:10px 14px;margin:0 0 18px;font-size:.95rem}
.fb{border-radius:10px;padding:12px 14px;margin-top:12px;border-left:5px solid}
.fb.good{background:var(--safe-bg);border-color:var(--safe)}
.fb.bad{background:var(--danger-bg);border-color:var(--danger)}
.fb.meh{background:var(--surface2);border-color:var(--accent)}
.fb p:last-child{margin-bottom:0}
.fb strong{display:block;margin-bottom:2px}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:700;background:var(--surface2)}
.tag.good{background:var(--safe-bg);color:var(--safe)} .tag.bad{background:var(--danger-bg);color:var(--danger)}

/* hub */
.hero{display:grid;gap:10px;margin-bottom:30px}
.hero p{font-size:1.12rem;color:var(--muted)}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.case{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.case:hover{border-color:var(--accent)}
.case .ico{width:52px;height:52px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;color:var(--accent-text)}
.case strong{font-family:'Bricolage Grotesque',sans-serif;font-size:1.25rem;display:block}
.case .meta{display:block;margin-top:8px}
.case.locked{opacity:.6}
.capstone{margin-top:14px;border-style:dashed}

/* module chrome */
.mod h1{font-size:clamp(1.8rem,4.5vw,2.6rem)}
.stepline{color:var(--muted);margin:-.2em 0 18px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;align-items:start}
@media (max-width:720px){.two{grid-template-columns:1fr}}

/* password lab */
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.seg button{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.92rem;text-align:left}
.seg button[aria-pressed=true]{border-color:var(--accent);background:var(--surface2);font-weight:700}
.vault{width:100%;max-width:240px;display:block;margin:0 auto}
.meter{height:16px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0}
.meter span{display:block;height:100%;background:var(--danger);transition:width .5s}
.rate{font-family:'Bricolage Grotesque',sans-serif;font-size:1.6rem;font-weight:800}
.rate.bad{color:var(--danger)} .rate.mid{color:var(--accent-text)} .rate.good{color:var(--safe)}
table.t{border-collapse:collapse;width:100%;font-size:.95rem}
table.t td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
table.t td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:5px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem}
.chip:hover{border-color:var(--accent)}
ul.tips{padding-left:1.1em;margin:.4em 0}
ul.tips li{margin:.25em 0}

/* breach sim */
.acct{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.acct:first-child{border-top:0}
.acct .st{font-weight:700;font-size:.9rem}
.acct .st.fell{color:var(--danger)} .acct .st.safe{color:var(--safe)}
.sw{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.sw button{background:var(--surface);border:0;padding:6px 11px;font-size:.88rem}
.sw button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* quiz */
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--safe);background:var(--safe-bg)}
.opt.wrong{border-color:var(--danger);background:var(--danger-bg)}
.opt[disabled]{cursor:default}

/* triage */
.msg{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.msg-h{display:flex;gap:10px;align-items:center;padding:12px 16px;background:var(--surface2);flex-wrap:wrap}
.msg-h .av{width:36px;height:36px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800}
.msg-h .ch{margin-left:auto;font-size:.85rem;color:var(--muted)}
.msg-b{padding:16px}
.fakelink{color:var(--info);text-decoration:underline;word-break:break-all}
.insp{background:var(--surface2);border-radius:10px;padding:10px 14px;margin-top:14px;font-size:.95rem}
.insp h3{font-size:1rem;margin-bottom:4px}
.qr{width:96px;height:96px;display:block;margin:10px 0;background:#fff;padding:6px;border-radius:6px}
.prog{display:flex;gap:5px;margin:0 0 14px}
.prog i{flex:1;height:6px;border-radius:99px;background:var(--surface2)}
.prog i.on{background:var(--accent)} .prog i.ok{background:var(--safe)} .prog i.no{background:var(--danger)}

/* access control */
.person{display:grid;grid-template-columns:1fr;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person .lv{display:flex;flex-wrap:wrap;gap:6px}
.person .lv button{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.88rem}
.person .lv button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.perm{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}

/* bug bounty */
.portal{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;color:#1a1d33}
.portal .bar{background:#dfe2f2;padding:8px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;color:#444a78}
.portal .body{padding:16px;display:grid;gap:14px}
.hot{display:block;width:100%;text-align:left;background:#f4f5fc;border:2px dashed #9aa1d6;border-radius:10px;padding:10px 12px;color:#1a1d33}
.hot:hover{border-color:#e08a00}
.hot.found{border-style:solid;border-color:#0B7A55;background:#e2f6ee}
.sticky{background:#ffe27a;transform:rotate(-1.5deg);padding:6px 10px;display:inline-block;font-family:'Comic Sans MS',cursive;font-size:.85rem;margin-top:6px}
.log li{margin:.5em 0}
.cipher{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.25rem;letter-spacing:.06em;word-break:break-word;background:var(--surface2);border-radius:10px;padding:12px 14px;margin:8px 0}

/* capstone */
.tl{position:relative;margin:10px 0;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:3px}
.ev{position:relative;margin-bottom:18px}
.ev::before{content:"";position:absolute;left:-26px;top:6px;width:19px;height:19px;border-radius:50%;background:var(--danger);border:4px solid var(--bg)}
.ev.fixed::before{background:var(--safe)}
.closed{background:var(--surface);border:1px solid var(--safe);border-radius:16px;padding:22px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{
  .top,.noprint{display:none!important}
  body{background:#fff;color:#000;font-size:12pt}
  .card{border:1px solid #999}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" data-act="home" aria-label="Night Shift home"><i></i>Night Shift</button>
    <div class="rank" id="rank"></div>
    <button class="tbtn" data-act="theme" id="themeBtn" aria-label="Switch light or dark theme">Theme</button>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>

<script>
(function(){
'use strict';

/* ---------- helpers & state ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const app = $('#app');
const LS = 'nightshift.v1';
let S = {xp:0, done:{}, theme:null};
try { const r = localStorage.getItem(LS); if (r) S = Object.assign(S, JSON.parse(r)); } catch(e) {}
function save(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e) {} }
function shuffle(a){ const b = a.slice(); for (let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
if (S.theme) document.documentElement.setAttribute('data-theme', S.theme);

const RANKS = [[0,'Intern'],[100,'Junior analyst'],[200,'Analyst'],[400,'Senior analyst'],[550,'Incident lead']];
function rankInfo(){
  let cur = RANKS[0], next = null;
  for (let i=0;i<RANKS.length;i++){ if (S.xp >= RANKS[i][0]){ cur = RANKS[i]; next = RANKS[i+1] || null; } }
  return {cur, next};
}
function renderRank(){
  const r = rankInfo();
  const pct = r.next ? Math.round((S.xp - r.cur[0]) / (r.next[0] - r.cur[0]) * 100) : 100;
  $('#rank').innerHTML = `<span><b>${r.cur[1]}</b> &middot; ${S.xp} XP</span><span class="xpbar" role="img" aria-label="${pct}% of the way to the next rank"><span style="width:${pct}%"></span></span>`;
}
function award(id, xp){
  if (S.done[id]) return false;
  S.done[id] = true; S.xp += xp; save(); renderRank(); return true;
}
const MODS_DONE = () => ['pw','ph','ac','bb'].filter(k => S.done[k]).length;

/* ---------- router & global actions ---------- */
const VIEWS = {};
function go(v){
  window.scrollTo(0,0);
  VIEWS[v]();
  const h = app.querySelector('h1');
  if (h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
}
const ACT = {
  home: () => go('hub'),
  go: (el) => go(el.dataset.v),
  theme: () => {
    const root = document.documentElement;
    const isDark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    S.theme = isDark ? 'light' : 'dark';
    root.setAttribute('data-theme', S.theme); save();
  },
  print: () => window.print(),
  reset: () => {
    if (confirm('Reset all progress on this device?')) { S = {xp:0, done:{}, theme:S.theme}; save(); renderRank(); go('hub'); }
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
});

/* ---------- shared pieces ---------- */
function ic(n){
  const p = {
    lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    hook:'<path d="M3 7l9 6 9-6"/><rect x="3" y="5" width="18" height="14" rx="2"/>',
    keys:'<circle cx="8" cy="9" r="3.5"/><path d="M11 11l8 8M16 16l2-2M14 14l2-2"/>',
    bug:'<rect x="8" y="8" width="8" height="11" rx="4"/><path d="M12 8V5M4 12h4M16 12h4M5 18l3-2M19 18l-3-2M5 6l3 2M19 6l-3 2"/>',
    flag:'<path d="M6 21V4M6 5h11l-2 4 2 4H6"/>'
  }[n];
  return `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}
function frame(title, step, inner){
  return `<div class="mod"><button class="link" data-act="home">&lsaquo; Back to cases</button><h1>${title}</h1>${step ? `<p class="stepline">${step}</p>` : ''}${inner}</div>`;
}
function closed(id, title, xp, points){
  const first = award(id, xp);
  return `<div class="closed"><h2>Case closed: ${title}</h2><p>${first ? `+${xp} XP added to your rank.` : 'You already finished this one, so no new XP. Replay any time.'}</p><ul class="tips">${points.map(p => `<li>${p}</li>`).join('')}</ul><div class="row"><button class="btn" data-act="home">Back to cases</button></div></div>`;
}
function runQuiz(root, qs, done){
  let i = 0, score = 0;
  function show(){
    const q = qs[i];
    const opts = shuffle(q.o.map((t,k) => ({t,k})));
    root.innerHTML = `<div class="card"><p class="muted">Question ${i+1} of ${qs.length}</p><h2>${q.q}</h2><div class="opts">${opts.map((o,n) => `<button class="opt" data-n="${n}">${o.t}</button>`).join('')}</div><div class="fbw" aria-live="polite"></div></div>`;
    root.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      const o = opts[+b.dataset.n]; const ok = o.k === q.a;
      if (ok) score++;
      root.querySelectorAll('.opt').forEach((x,n) => { x.disabled = true; if (opts[n].k === q.a) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      const last = i === qs.length - 1;
      root.querySelector('.fbw').innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}"><strong>${ok ? 'Right call.' : 'Not quite.'}</strong><p>${q.why}</p></div><div class="row"><button class="btn" id="qnext">${last ? 'Finish' : 'Next question'}</button></div>`;
      $('#qnext', root).addEventListener('click', () => { if (last) done(score, qs.length); else { i++; show(); } });
      $('#qnext', root).focus();
    }));
  }
  show();
}

/* ---------- HUB ---------- */
const CASES = [
  {id:'pw', ico:'lock', name:'Crack Lab', mins:8, text:'Type a password, then watch a cracking bot go after it. See how one breach can topple every account you own.'},
  {id:'ph', ico:'hook', name:'Triage', mins:8, text:'Eight messages hit your queue. Decide which are real and which are traps, using the clues attackers leave behind.'},
  {id:'ac', ico:'keys', name:'Access Control', mins:8, text:'Hand out roles, share files and approve app permissions. Learn why everyone should get only the access their job needs.'},
  {id:'bb', ico:'bug', name:'Bug Bounty Jr.', mins:10, text:'Spot weak points in a practice target, then decide what a responsible researcher does next.'}
];
VIEWS.hub = () => {
  const n = MODS_DONE();
  app.innerHTML = `
  <section class="hero">
    <h1>Your first shift starts now.</h1>
    <p>Gamerly is a small game studio, and you just joined its security team. Work through four case files, then take on a real incident. Each one takes about ten minutes, and you can play them in any order.</p>
    <p class="muted" style="font-size:.95rem">Everything runs in your browser. Nothing you type is sent anywhere or saved except your progress, which stays on this device.</p>
    <div style="display: flex">
      <div>
        <p>The dastardly cyber villain Cyber-Hacks has a series of scheme to break your security.</p>
        <p>Thwart his plans by working through these case files to unlock and solve the incident!</p>
      </div>
      <div><img src="./cyberhack2.jpeg" style="width: 50%">
    </div>
</div>
  </section>
  <div class="cases">
    ${CASES.map(c => `<button class="case" data-act="go" data-v="${c.id}"><span class="ico">${ic(c.ico)}</span><span><strong>${c.name}</strong><span class="muted">${c.text}</span><span class="meta"><span class="tag ${S.done[c.id] ? 'good' : ''}">${S.done[c.id] ? 'Completed' : `About ${c.mins} min`}</span></span></span></button>`).join('')}
  </div>
  <button class="case capstone ${n < 4 ? 'locked' : ''}" style="width:100%" ${n < 4 ? 'disabled' : 'data-act="go" data-v="cap"'}>
    <span class="ico">${ic('flag')}</span>
    <span><strong>The Gamerly incident</strong><span class="muted">${n < 4 ? `Finish all four case files to unlock this (${n} of 4 done). A breach is under way and you will trace how it happened.` : 'A breach is under way. Trace how weak passwords, a phishing click and loose permissions combined, then fix each link in the chain.'}</span><span class="meta"><span class="tag ${S.done.cap ? 'good' : ''}">${S.done.cap ? 'Completed' : (n < 4 ? 'Locked' : 'Ready')}</span></span></span>
  </button>
  <div class="row noprint" style="margin-top:28px">
    <button class="btn ghost" data-act="go" data-v="grown">For parents and teachers</button>
    <button class="link" data-act="reset" style="margin:0 0 0 auto">Reset progress</button>
  </div>`;
};

/* =====================================================
   CASE 1: CRACK LAB
   ===================================================== */
const COMMON = ['password','123456','12345678','123456789','1234567890','qwerty','abc123','letmein','iloveyou','admin','welcome','monkey','dragon','football','minecraft','fortnite','roblox','princess','sunshine','master','shadow','superman','batman','pokemon','starwars','trustno1','login','passw0rd','baseball','soccer','hello','freedom','whatever','qazwsx','1q2w3e4r','111111','000000','123123','654321','password1','gaming','gamer','ninja','secret','cookie','summer','love','jordan','michael','charlie','tigger','hockey','basketball','computer','internet','google','snapchat','tiktok','amazing','flower','rainbow'];

  app.innerHTML = frame('Bug Bounty Jr.', 'Step 3 of 4: crack a safe puzzle', `

const INC = [
  {title:'Alex reused a password', story:'Alex, a Gamerly intern, used the same password for the company email and a fan forum. The forum was breached and the password leaked.',
   fixes:['Make everyone change their password every week','Require a unique password for every account (with a password manager) and two-factor authentication','Block the forum on work computers'], a:1,
   why:'Unique passwords stop one breach from spreading, and two-factor means a stolen password alone is not enough. Forced weekly changes tend to produce weaker, predictable passwords.'},
  {title:'A fake refund email', story:'An attacker emailed the support team a "refund tool" link. Sam clicked it and typed in the company login.',
   fixes:['Fire Sam so people are afraid to click','Train staff to spot and report phishing, with an easy report button, and use two-factor so a stolen login is not enough','Ban all links in email'], a:1,
   why:'Everyone gets fooled eventually. Good defenses assume mistakes will happen: make reporting easy and add a second lock. Punishing people makes them hide mistakes.'},
  {title:'Sam could see everything', story:'Sam\'s support account could read all player data, change billing and delete accounts, so the attacker could too.',
   fixes:['Give every employee the same access so it is fair','Give support only the access needed for the ticket they are working on, with extra rights granted temporarily when approved','Trust Sam more after training'], a:1,
   why:'This is least privilege. If the account had been limited, the attacker would have gotten very little.'},
  {title:'The warning nobody read', story:'Two weeks earlier, a researcher emailed Gamerly about an exposed test page. Nobody checked that inbox.',
   fixes:['Delete the inbox','Publish a security contact page, assign someone to respond and thank people who report problems','Threaten legal action against researchers'], a:1,
   why:'Responsible researchers want to help. Making it easy to report, and responding quickly, turns outsiders into allies and catches problems before attackers do.'}
];
const CAP = {};
VIEWS.cap = () => { CAP.fixed = {}; capShow(); };
function capShow(){
  const nfix = Object.keys(CAP.fixed).length;
  app.innerHTML = frame('The Gamerly incident', 'An attacker got into player accounts last night. Review the timeline and fix each weak link.', `
    <div class="tl">
      ${INC.map((e,i) => `<div class="ev ${CAP.fixed[i] ? 'fixed' : ''}"><h3>${e.title}</h3><p>${e.story}</p>
        ${CAP.fixed[i] ? `<div class="fb good"><strong>Fixed.</strong><p>${e.why}</p></div>` : `<div class="opts">${e.fixes.map((f,k) => `<button class="opt" data-e="${i}" data-k="${k}">${f}</button>`).join('')}</div><div id="ef${i}" aria-live="polite"></div>`}</div>`).join('')}
    </div>
    ${nfix === INC.length ? `<div id="capend"></div>` : `<p class="muted">${nfix} of ${INC.length} links fixed.</p>`}`);
  app.querySelectorAll('[data-e]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.e, k = +b.dataset.k, e = INC[i];
    if (k === e.a) { CAP.fixed[i] = true; capShow(); }
    else $('#ef' + i).innerHTML = '<div class="fb bad"><strong>That would not hold.</strong><p>Think about what would stop this link from repeating, without causing new problems. Try another option.</p></div>';
  }));
  if (nfix === INC.length) {
    $('#capend').innerHTML = closed('cap', 'The Gamerly incident', 150, ['Real breaches are rarely one mistake. A reused password, a phishing click and loose permissions can chain together.', 'Strong, unique passwords with two-factor, careful reading of messages, least privilege and a welcome mat for researchers each break a link in that chain.', 'You finished every case file. You are ready for the job.']);
  }
}

      <p>Plan on 8 to 10 minutes per case, or about 50 minutes for everything. In a classroom, pairs working through a case and discussing each choice tend to work well.</p>

      <ul class="tips">
        <li><b>Passwords:</b> use long passwords or passphrases, a different one for every account, a password manager, and two-factor authentication, starting with email.</li>
        <li><b>Phishing:</b> check who sent it, what it asks for, how it pressures, and where the link really goes. Never share login codes.</li>
        <li><b>Least privilege:</b> give people, apps and sharing links only the access they need, and review it regularly.</li>
        <li><b>Ethical hacking:</b> permission and scope define the difference between research and intrusion. Report privately and practice legally.</li>
      </ul>
    </div>
    <div class="card" style="margin-bottom:14px">

        <li>If you found a flaw in a school or game website, who would you tell?</li>

    </div>

};
